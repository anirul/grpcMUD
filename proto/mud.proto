syntax = "proto3";

package mud.v1;

service MudService {
  // A single game session stream. Commands are sent immediately while
  // world/tick updates are delivered asynchronously by the server.
  rpc Play(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  oneof payload {
    JoinRequest join = 1;
    CommandRequest command = 2;
    Ping ping = 3;
  }
}

message JoinRequest {
  string player_name = 1;
}

message CommandRequest {
  string request_id = 1;
  string text = 2;
}

message Ping {}

message ServerMessage {
  uint64 server_time_ms = 1;
  uint64 tick_id = 2;

  oneof payload {
    JoinAck join_ack = 10;
    CommandAck command_ack = 11;
    WorldEvent world_event = 12;
    ErrorMessage error = 13;
    Pong pong = 14;
    TickEvent tick = 15;
    LocalViewUpdate view = 16;
  }
}

message JoinAck {
  string player_id = 1;
  string motd = 2;
}

message CommandAck {
  string request_id = 1;
  bool accepted = 2;
  string message = 3;
}

message WorldEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ROOM = 1;
    KIND_CHAT = 2;
    KIND_SYSTEM = 3;
    KIND_COMBAT = 4;
  }

  Kind kind = 1;
  string room_id = 2;
  string actor_id = 3;
  string text = 4;
}

message TickEvent {
  uint64 tick_id = 1;
  uint64 server_time_ms = 2;
}

message ErrorMessage {
  string code = 1;
  string message = 2;
}

message Pong {}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_NORTH = 1;
  DIRECTION_EAST = 2;
  DIRECTION_SOUTH = 3;
  DIRECTION_WEST = 4;
}

message VisibleSquare {
  string square_id = 1;
  int32 x = 2;
  int32 y = 3;
  bool open_north = 4;
  bool open_east = 5;
  bool open_south = 6;
  bool open_west = 7;
}

message VisibleActor {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SELF = 1;
    KIND_PLAYER = 2;
    KIND_NPC = 3;
  }

  string actor_id = 1;
  string name = 2;
  int32 x = 3;
  int32 y = 4;
  Kind kind = 5;
  Direction facing = 6;
}

message LocalViewUpdate {
  string center_square_id = 1;
  int32 center_x = 2;
  int32 center_y = 3;
  Direction facing = 4;
  int32 radius = 5;
  repeated VisibleSquare squares = 6;
  repeated VisibleActor actors = 7;
}

// Persistent square map storage for the server-side world database.
message SquareRecord {
  string square_id = 1;
  int32 x = 2;
  int32 y = 3;
  bool open_north = 4;
  bool open_east = 5;
  bool open_south = 6;
  bool open_west = 7;
  string description = 8;
}

message SquareMapData {
  repeated SquareRecord squares = 1;
}
