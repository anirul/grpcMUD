syntax = "proto3";

package mud.v1;

import "world_storage.proto";

service MudService {
  // A single game session stream. Commands are sent immediately while
  // world/tick updates are delivered asynchronously by the server.
  rpc Play(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  oneof payload {
    JoinRequest join = 1;
    Ping ping = 2;
    LookRequest look = 3;
    StepRequest step = 4;
    SayRequest say = 5;
    GuardRequest guard = 6;
    AttackRequest attack = 7;
  }
}

message JoinRequest {
  string player_name = 1;
}

message Ping {}

message LookRequest {
  string request_id = 1;
}

enum StepKind {
  STEP_KIND_UNSPECIFIED = 0;
  STEP_KIND_MOVE_FORWARD = 1;
  STEP_KIND_MOVE_BACKWARD = 2;
  STEP_KIND_TURN_LEFT = 3;
  STEP_KIND_TURN_RIGHT = 4;
}

message StepRequest {
  string request_id = 1;
  StepKind kind = 2;
}

message SayRequest {
  string request_id = 1;
  string text = 2;
}

message GuardRequest {
  string request_id = 1;
}

message ServerMessage {
  uint64 server_time_ms = 1;
  uint64 tick_id = 2;

  oneof payload {
    JoinAck join_ack = 10;
    CommandAck command_ack = 11;
    WorldEvent world_event = 12;
    ErrorMessage error = 13;
    Pong pong = 14;
    TickEvent tick = 15;
    LocalViewUpdate view = 16;
  }
}

message JoinAck {
  string player_id = 1;
  string motd = 2;
}

message CommandAck {
  string request_id = 1;
  bool accepted = 2;
  string message = 3;
}

message WorldEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ROOM = 1;
    KIND_CHAT = 2;
    KIND_SYSTEM = 3;
    KIND_COMBAT = 4;
  }

  Kind kind = 1;
  string room_id = 2;
  string actor_id = 3;
  string text = 4;
}

message TickEvent {
  uint64 tick_id = 1;
  uint64 server_time_ms = 2;
}

message ErrorMessage {
  string code = 1;
  string message = 2;
}

message Pong {}

enum WeaponKind {
  WEAPON_KIND_UNSPECIFIED = 0;
  WEAPON_KIND_MELEE = 1;
  WEAPON_KIND_RANGED = 2;
}

message AttackRequest {
  string request_id = 1;
  WeaponKind weapon = 2;
}

message VisibleSquare {
  string square_id = 1;
  int32 x = 2;
  int32 y = 3;
  bool open_north = 4;
  bool open_east = 5;
  bool open_south = 6;
  bool open_west = 7;
  SquareKind kind = 8;
}

message VisibleActor {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SELF = 1;
    KIND_PLAYER = 2;
    KIND_NPC = 3;
  }

  string actor_id = 1;
  string name = 2;
  int32 x = 3;
  int32 y = 4;
  Kind kind = 5;
  Direction facing = 6;
}

message FirstPersonCell {
  int32 depth = 1;
  int32 lane = 2;
  bool visible = 3;
  bool open_forward = 4;
  bool open_left = 5;
  bool open_right = 6;
  VisibleActor.Kind actor_kind = 7;
  Direction actor_facing = 8;
  string actor_name = 9;
}

message FirstPersonView {
  Direction facing = 1;
  int32 max_depth = 2;
  repeated FirstPersonCell cells = 3;
}

message LocalViewUpdate {
  string center_square_id = 1;
  int32 center_x = 2;
  int32 center_y = 3;
  Direction facing = 4;
  int32 radius = 5;
  repeated VisibleSquare squares = 6;
  repeated VisibleActor actors = 7;
  FirstPersonView first_person = 8;
}
